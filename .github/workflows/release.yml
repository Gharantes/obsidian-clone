name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Windows only for now. Linux and macOS can come back as a matrix (they were ubuntu-22.04, which
  # needs the webkit2gtk packages installed, and macos-latest with --target universal-apple-darwin).
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache warm-cache.yml saves on main: a run can't use caches saved under other
      # tags, so this one doesn't save its own.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: false

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: obsidian-clone ${{ github.ref_name }}
          releaseDraft: false
