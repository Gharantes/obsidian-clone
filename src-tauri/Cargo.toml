[package]
name = "obsidian-clone"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.54.0", features = ["process", "io-util", "sync", "macros", "rt"] }
tokio-util = "0.7.20"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
