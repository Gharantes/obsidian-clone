<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Obsidian Clone</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #app, .cm-editor { height: 100%; }
      .picker { max-width: 480px; margin: 0 auto; padding: 48px 16px; box-sizing: border-box; }
      .picker button { font: inherit; padding: 8px 14px; cursor: pointer; }
      .picker .error { color: #c62828; min-height: 1.2em; }
      .picker ul { list-style: none; padding: 0; }
      .picker li { padding: 8px; border-radius: 6px; cursor: pointer; }
      .picker li:hover { background: #0001; }
      .picker small { display: block; color: #666; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
